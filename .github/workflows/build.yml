name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and assemble debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

  signed:
    name: Assemble permanently signed APK
    needs: build
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    environment: drivehome-signing
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged commit belongs to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Assemble signed APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DRIVEHOME_SIGNING_REQUIRED: 'true'
        run: |
          set -euo pipefail
          umask 077
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD}"
          export DRIVEHOME_KEYSTORE_FILE="$RUNNER_TEMP/drivehome.jks"
          trap 'rm -f "$DRIVEHOME_KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$DRIVEHOME_KEYSTORE_FILE"
          unset KEYSTORE_BASE64
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gradle --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "dist/drivehome-${GITHUB_REF_NAME}.apk"
          else
            gradle --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk dist/drivehome-signed.apk
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs dist/*.apk
          keytool -exportcert -keystore "$DRIVEHOME_KEYSTORE_FILE" -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD > "$RUNNER_TEMP/drivehome-cert.der"
          expected="$(sha256sum "$RUNNER_TEMP/drivehome-cert.der" | cut -d' ' -f1)"
          actual="$("$apksigner" verify --print-certs dist/*.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$actual" = "$expected"
          rm -f "$RUNNER_TEMP/drivehome-cert.der"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: drivehome-signed
          path: dist/*.apk
          if-no-files-found: error
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          body: Permanently signed DriveHome release.
      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/drivehome.jks" "$RUNNER_TEMP/drivehome-cert.der"
